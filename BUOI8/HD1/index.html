<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành JavaScript Console</title>
</head>
<body>
    <h1>Bài thực hành: Hello JS Console</h1>
    <p>Hãy nhấn F12 và chuyển sang tab Console để xem kết quả thực thi!</p>

    <!-- Đoạn mã JavaScript được gộp chung trực tiếp vào đây -->
    <script>
        // 1. Khai báo tên và tuổi
        let ten = "Thịnh";
        let tuoi = 20;
        console.log("Xin chào, tôi tên là " + ten + ", " + tuoi + " tuổi.");

        // 2. Các phép toán cơ bản
        console.log("10 + 5 =", 10 + 5);
        console.log("20 - 8 =", 20 - 8);

        // 3. Vibe Coding: Giải thích '10' + 20
        let ketQua = '10' + 20;
        console.log("Kết quả của '10' + 20 là:", ketQua); 
        // Sẽ ra chuỗi '1020' do ép kiểu ngầm (type coercion)
    </script>
</body>
</html>
