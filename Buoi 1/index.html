<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Khai báo bảng mã ký tự hỗ trợ tiếng Việt -->
    <meta charset="UTF-8">
    
    <!-- Cấu hình hiển thị chuẩn Responsive trên thiết bị di động -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tiêu đề trang web hiển thị trên thẻ trình duyệt -->
    <title>Trang Web Của Tôi</title>

    <!-- Thêm CSS trực tiếp hoặc liên kết đến file CSS bên ngoài -->
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- Phần đầu trang (Header) -->
    <header>
        <h1>Chào mừng đến với trang web của tôi</h1>
    </header>

    <!-- Phần nội dung chính (Main Content) -->
    <main>
        <section>
            <h2>Giới thiệu</h2>
            <p>Đây là đoạn văn bản ví dụ sử dụng cấu trúc HTML5 cơ bản.</p>
        </section>

        <section>
            <h2>Danh sách liên kết</h2>
            <ul>
                <li><a href="https://google.com" target="_blank">Google</a></li>
                <li><a href="https://github.com" target="_blank">GitHub</a></li>
            </ul>
        </section>
    </main>

    <!-- Phần chân trang (Footer) -->
    <footer>
        <p>&copy; 2026 Bản quyền thuộc về tôi.</p>
    </footer>

    <!-- Thêm JavaScript (nếu có) -->
    <script>
        console.log("Trang web đã tải thành công!");
    </script>
</body>
</html>
