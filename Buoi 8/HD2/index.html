<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hoạt động 2: Logic Builder</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .box { padding: 20px; border: 1px solid #ccc; width: 350px; border-radius: 5px; }
        input { padding: 8px; width: 200px; margin-right: 5px; }
        button { padding: 8px 12px; background: #27ae60; color: white; border: none; cursor: pointer; }
        .result { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <h3>Hoạt động 2: Máy tính xếp loại</h3>
        <p>Nhập điểm số (0 - 10):</p>
        <input type="number" id="diemSo" placeholder="Nhập điểm..." min="0" max="10" step="0.1">
        <button onclick="kiemTraDiem()">Kiểm tra</button>
        <div class="result" id="ketQua"></div>
    </div>

    <script>
        function kiemTraDiem() {
            let inputVal = document.getElementById("diemSo").value;
            let thongBao = document.getElementById("ketQua");

            if (inputVal === "") {
                thongBao.style.color = "red";
                thongBao.innerText = "Vui lòng nhập điểm số!";
                return;
            }

            let diem = parseFloat(inputVal);
            let xepLoai = "";

            // Cấu trúc điều kiện If - Else (LLO 3.1.2)
            if (diem > 8.0 && diem <= 10) {
                xepLoai = "Giỏi 🌟";
            } else if (diem >= 6.5) {
                xepLoai = "Khá 👍";
            } else if (diem >= 5.0) {
                xepLoai = "Trung bình 😐";
            } else if (diem >= 0 && diem < 5.0) {
                xepLoai = "Yếu ⚠️";
            } else {
                xepLoai = "Điểm không hợp lệ (0-10)!";
                thongBao.style.color = "red";
                thongBao.innerText = xepLoai;
                return;
            }

            thongBao.style.color = "#2980b9";
            thongBao.innerText = "Xếp loại: " + xepLoai;

            // Debug cơ bản bằng console.log() (LLO 3.1.4)
            console.log("Điểm người dùng nhập:", diem, "| Xếp loại:", xepLoai);
        }
    </script>
</body>
</html>
