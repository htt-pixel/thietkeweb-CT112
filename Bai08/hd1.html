<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hoạt động 1 - Hello JS Console</title>
</head>
<body>
    <h1>Hoạt động 1: Hello JS Console</h1>

    <script>
        // Khai báo biến tên và tuổi của bạn
        let ten = "Nguyen Van A";
        let tuoi = 20;

        // In kết quả ra màn hình Console
        console.log("Xin chào, tôi tên là " + ten + " và tôi " + tuoi + " tuổi.");

        // Thực hiện các phép toán
        console.log("10 + 5 = " + (10 + 5));
        console.log("10 - 5 = " + (10 - 5));
        console.log("10 * 5 = " + (10 * 5));
        console.log("10 / 5 = " + (10 / 5));
    </script>
</body>
</html>
