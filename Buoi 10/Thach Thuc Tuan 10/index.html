<!DOCTYPE html>
<html lang="vi">
<body>

    <h2 id="thongbao">xin chào sinh viên!</h2>
    <button id="nutbam">Bấm vào đây</button>

    <script>
        let chu = document.getElementById("thongbao");
        let nut = document.getElementById("nutbam");

        nut.addEventListener("click", function() {
            chu.innerHTML = "Chào mừng đến với môn Thiết kế";
        });
    </script>

</body>
</html>
