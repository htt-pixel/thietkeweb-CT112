<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tuần 10 - Hoạt động 1: The Element Picker</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; line-height: 1.6; }
        .box { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; max-width: 500px; }
        ul#menu { list-style-type: square; padding-left: 20px; }
        button { padding: 10px 15px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Hoạt động 1: The Element Picker (Truy vấn DOM)</h2>
        
        <div id="menu">
            <p>Thành phần 1 bên trong Menu</p>
            <p>Thành phần 2 bên trong Menu</p>
            <ul>
                <li>Mục con A</li>
                <li>Mục con B</li>
            </ul>
        </div>

        <button id="btnDoiMau">Đổi màu tất cả thẻ con trong #menu sang đỏ</button>
    </div>

    <script>
        // LLO 3.3.1 & 3.3.3: Sử dụng querySelector / querySelectorAll kết hợp addEventListener
        const btnDoiMau = document.getElementById("btnDoiMau");

        btnDoiMau.addEventListener("click", function() {
            // Lấy tất cả các thẻ nằm bên trong phần tử có id là 'menu'
            const cacTheBenTrong = document.querySelectorAll("#menu *");
            
            console.log("Số lượng thẻ tìm thấy trong #menu:", cacTheBenTrong.length);

            // Dùng vòng lặp để đổi màu chữ sang màu đỏ theo gợi ý Prompt
            cacTheBenTrong.forEach(function(el) {
                el.style.color = "red";
            });

            console.log("Đã chuyển toàn bộ chữ trong #menu thành màu đỏ thành công!");
        });
    </script>

</body>
</html>
