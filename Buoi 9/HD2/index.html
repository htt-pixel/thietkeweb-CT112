<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tuần 9 - Hoạt động 2: Function Factory</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; line-height: 1.6; }
        .container { background: #eef9f5; padding: 20px; border-radius: 8px; max-width: 550px; }
        input { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { padding: 10px 15px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .result-box { margin-top: 15px; padding: 10px; background: #fff; border-left: 4px solid #27ae60; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Hoạt động 2: Function Factory (Hàm & Tham số)</h2>
        
        <h3>1. Tính diện tích hình chữ nhật</h3>
        <button onclick="chayDemoTinhDienTich()">Chạy thử 3 hình mẫu (Xem Console F12)</button>

        <hr>

        <h3>2. Tính tuổi người dùng (Prompt mẫu)</h3>
        <label>Nhập họ và tên:</label>
        <input type="text" id="inputTen" placeholder="Ví dụ: Võ Minh Quang">
        
        <label>Nhập năm sinh:</label>
        <input type="number" id="inputNamSinh" placeholder="Ví dụ: 2005">
        
        <button onclick="thucHienChaoHỏi()">Tạo lời chào & Tính tuổi</button>

        <div class="result-box" id="kqHienThi">Kết quả sẽ hiển thị ở đây...</div>
    </div>

    <script>
        // LLO 3.2.2: Khai báo hàm có tham số và trả về giá trị (Return)
        
        // 1. Hàm tính diện tích hình chữ nhật
        function tinhDienTich(dai, rong) {
            return dai * rong; // Trả về kết quả tính toán
        }

        function chayDemoTinhDienTich() {
            console.log("=== TÍNH DIỆN TÍCH HÌNH CHỮ NHẬT ===");
            let dt1 = tinhDienTich(5, 10);
            let dt2 = tinhDienTich(7.5, 3);
            let dt3 = tinhDienTich(12, 4);

            console.log("Hình 1 (5x10):", dt1);
            console.log("Hình 2 (7.5x3):", dt2);
            console.log("Hình 3 (12x4):", dt3);
            alert("Đã tính xong 3 hình mẫu! Hãy mở Console (F12) để kiểm tra.");
        }

        // 2. Hàm tạo lời chào và tính tuổi theo Prompt mẫu
        function taoLoiChao(hoTen, namSinh) {
            const namHienTai = new Date().getFullYear(); // Lấy năm hiện tại
            const tuoi = namHienTai - namSinh;
            return `Chào ${hoTen}, bạn hiện tại ${tuoi} tuổi.`;
        }

        function thucHienChaoHỏi() {
            let ten = document.getElementById("inputTen").value;
            let ns = document.getElementById("inputNamSinh").value;

            if (!ten || !ns) {
                alert("Vui lòng nhập đầy đủ tên và năm sinh!");
                return;
            }

            // Gọi hàm và nhận giá trị trả về
            let thongBao = taoLoiChao(ten, parseInt(ns));
            
            // Hiển thị ra màn hình và Console
            document.getElementById("kqHienThi").innerText = thongBao;
            console.log(thongBao);
        }
    </script>

</body>
</html>
